name: LinkedIn Agent

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analyze repository
        env:
          GITHUB_OWNER: talhacdc07-prog
        run: python agents/github_activity.py

      - name: Clear previous draft
        run: Remove-Item output\linkedin_post.md -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Generate LinkedIn post content
        run: python agents/linkedin_writer.py

      - name: Prepare LinkedIn draft
        if: hashFiles('output/linkedin_post.md') != ''
        run: |
          {
            echo "## LinkedIn gönderi taslağı"
            echo ""
            cat output/linkedin_post.md
            echo ""
            echo "### Paylaşmak için"
            echo "[LinkedIn paylaşım ekranını aç](https://www.linkedin.com/feed/?shareActive=true)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated content
        if: hashFiles('output/linkedin_post.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-content
          path: output/

      - name: Save generated content
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: generate LinkedIn project update"
          file_pattern: output/*
