name: LinkedIn Agent

on:
  push:
    branches:
      - main
    paths-ignore:
      - "output/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analyze repository
        run: python agents/github_analyzer.py

      - name: Generate LinkedIn post
        run: python agents/linkedin_writer.py

      - name: Prepare LinkedIn draft
        run: |
          {
            echo "## LinkedIn gönderi taslağı"
            echo ""
            cat output/linkedin_post.md
            echo ""
            echo "### Paylaşmak için"
            echo "[LinkedIn paylaşım ekranını aç](https://www.linkedin.com/feed/?shareActive=true)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated content
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-content
          path: output/

      - name: Save generated content
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: generate LinkedIn project update"
          file_pattern: output/*
